[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rag-support-scorer"
version = "0.1.0"
description = "Answer-conditioned context selection and harm prediction research"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "rag-support-scorer contributors" }]
dependencies = [
  "numpy>=2.1,<3",
  "pydantic>=2.10,<3",
  "pyyaml>=6.0.2,<7",
  "scikit-learn>=1.6,<2",
]

[project.optional-dependencies]
train = [
  "accelerate>=1.14,<2",
  "bitsandbytes>=0.50,<0.51; platform_system == 'Linux'",
  "datasets>=5,<6",
  "peft>=0.20,<0.21",
  "transformers>=5.16,<6",
  "trl>=1.12,<2",
]
azure = ["azure-ai-ml>=1.24,<2", "azure-identity>=1.19,<2"]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "types-pyyaml>=6.0.12.20241230",
]

[project.scripts]
rag-support-prepare = "rag_support_scorer.data.ingest:main"
rag-support-train = "rag_support_scorer.train.reward:main"
rag-support-experiment = "rag_support_scorer.experiment.runner:main"
rag-support-smoke = "rag_support_scorer.experiment.smoke:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_support_scorer"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["rag_support_scorer"]

[[tool.mypy.overrides]]
module = ["datasets.*", "peft.*", "sklearn.*", "transformers.*", "trl.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["rag_support_scorer"]

[tool.coverage.report]
show_missing = true
skip_covered = true
