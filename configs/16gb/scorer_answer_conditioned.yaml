base_model: Qwen/Qwen3-0.6B
model_revision: "${SCORER_MODEL_REVISION}"
tokenizer_revision: "${SCORER_TOKENIZER_REVISION}"
scorer_kind: answer_conditioned
dataset_path: data/processed/answer_conditioned_preferences.jsonl
output_dir: outputs/16gb/answer_conditioned
seed: 0
max_sequence_length: 2048
learning_rate: 0.00002
epochs: 1
per_device_batch_size: 1
gradient_accumulation_steps: 16
use_4bit: true
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
cpu_validation: false
bf16: true
fp16: false
