base_model: Qwen/Qwen3-0.6B
model_revision: "${SCORER_MODEL_REVISION}"
tokenizer_revision: "${SCORER_TOKENIZER_REVISION}"
scorer_kind: answer_free
dataset_path: data/processed/answer_free_preferences.jsonl
output_dir: outputs/24gb/answer_free
seed: 0
max_sequence_length: 3072
learning_rate: 0.00002
epochs: 1
per_device_batch_size: 2
gradient_accumulation_steps: 8
use_4bit: true
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05
cpu_validation: false
bf16: true
fp16: false
