$schema: https://azuremlschemas.azureedge.net/latest/pipelineJob.schema.json
type: pipeline
display_name: matched-rag-support-scorers
experiment_name: rag-support-scorer
description: Prepare fixed preferences and train matched answer-free and answer-conditioned scorers.
identity:
  type: managed
inputs:
  source_data:
    type: uri_folder
  experiment_questions:
    type: uri_file
  wrong_answers:
    type: uri_file
  contradiction_scores:
    type: uri_file
  model_name: Qwen/Qwen3-0.6B
  model_revision: ""
  reader_model: ibm-granite/granite-3.3-2b-instruct
  reader_revision: ""
  answer_conditioned_calibration_scale: 1.0
  answer_conditioned_calibration_bias: 0.0
  split_seed: 17
  scorer_seed: 17
  epochs: 1
outputs:
  answer_free_model:
    type: uri_folder
  answer_conditioned_model:
    type: uri_folder
  experiment_results:
    type: uri_folder
jobs:
  prepare:
    type: command
    component: ../components/prepare_data.yml
    inputs:
      source_data: ${{parent.inputs.source_data}}
      split_seed: ${{parent.inputs.split_seed}}
  train_answer_free:
    type: command
    component: ../components/train_scorer.yml
    inputs:
      prepared_data: ${{parent.jobs.prepare.outputs.prepared_data}}
      scorer_kind: answer_free
      model_name: ${{parent.inputs.model_name}}
      model_revision: ${{parent.inputs.model_revision}}
      seed: ${{parent.inputs.scorer_seed}}
      epochs: ${{parent.inputs.epochs}}
    outputs:
      model: ${{parent.outputs.answer_free_model}}
  train_answer_conditioned:
    type: command
    component: ../components/train_scorer.yml
    inputs:
      prepared_data: ${{parent.jobs.prepare.outputs.prepared_data}}
      scorer_kind: answer_conditioned
      model_name: ${{parent.inputs.model_name}}
      model_revision: ${{parent.inputs.model_revision}}
      seed: ${{parent.inputs.scorer_seed}}
      epochs: ${{parent.inputs.epochs}}
    outputs:
      model: ${{parent.outputs.answer_conditioned_model}}
  run_experiment:
    type: command
    component: ../components/run_experiment.yml
    inputs:
      questions: ${{parent.inputs.experiment_questions}}
      wrong_answers: ${{parent.inputs.wrong_answers}}
      answer_free_checkpoint: ${{parent.jobs.train_answer_free.outputs.model}}
      answer_conditioned_checkpoint: ${{parent.jobs.train_answer_conditioned.outputs.model}}
      scorer_tokenizer_model: ${{parent.inputs.model_name}}
      scorer_tokenizer_revision: ${{parent.inputs.model_revision}}
      reader_model: ${{parent.inputs.reader_model}}
      reader_revision: ${{parent.inputs.reader_revision}}
      contradiction_scores: ${{parent.inputs.contradiction_scores}}
      answer_conditioned_calibration_scale: ${{parent.inputs.answer_conditioned_calibration_scale}}
      answer_conditioned_calibration_bias: ${{parent.inputs.answer_conditioned_calibration_bias}}
      seed: ${{parent.inputs.scorer_seed}}
    outputs:
      results: ${{parent.outputs.experiment_results}}
settings:
  default_compute: azureml:gpu-t4-low-priority
  continue_on_step_failure: false
