$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
name: fit_rag_support_calibration
version: "1"
display_name: Fit answer-conditioned Platt calibration
type: command
inputs:
  metrics:
    type: uri_folder
outputs:
  calibration:
    type: uri_folder
code: ../..
environment: azureml:rag-support-scorer:1
command: >-
  PYTHONPATH=src python -m rag_support_scorer.eval.calibrate_cli
  --input ${{inputs.metrics}}/validation_scores.jsonl
  --output ${{outputs.calibration}}/calibration.json
